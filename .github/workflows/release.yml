name: Release

# Pushing a tag vX.Y.Z publishes a GitHub release carrying index.html under the
# name both download links point at — releases/latest/download/mypassphrase.html
# — plus SHA256SUMS.txt, with the hash in the release notes. The asset is the
# exact committed file: the job refuses if SHA256SUMS.txt does not match it, so
# a release can never state a hash that the attached file fails. This replaces
# the hand-run checklist (bump, pin, commit, tag, name the asset correctly,
# re-download and check) with one tag push.
#
# Release notes: if docs/releases/<tag>.md exists it is used; otherwise the
# notes are the hash block alone. Edit the release afterwards to add prose.

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to create the release and upload its assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Pins and sums are current for the tagged commit
        run: node scripts/update-csp-hashes.mjs --check

      - name: Stage the asset under its download name and verify it
        run: |
          mkdir -p dist
          cp index.html dist/mypassphrase.html
          cp SHA256SUMS.txt dist/SHA256SUMS.txt
          cd dist
          sha256sum -c --ignore-missing SHA256SUMS.txt
          echo "SHA256=$(sha256sum mypassphrase.html | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Write the release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          {
            if [ -f "docs/releases/$TAG.md" ]; then cat "docs/releases/$TAG.md"; echo; fi
            echo "## Verify your download"
            echo
            echo '```'
            echo "$SHA256  mypassphrase.html"
            echo '```'
            echo
            echo 'macOS: `shasum -a 256 ~/Downloads/mypassphrase.html` · Linux: `sha256sum ~/Downloads/mypassphrase.html` · Windows: `Get-FileHash $HOME\Downloads\mypassphrase.html -Algorithm SHA256`'
            echo
            echo 'If the value differs, stop. Do not open the file.'
          } > notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/mypassphrase.html dist/SHA256SUMS.txt \
            --title "$TAG" --notes-file notes.md --verify-tag

      # The links live on GitHub, not on Pages, and can fail independently of
      # the site — v1.8.2 of the sister project shipped an asset under the wrong
      # name and 404'd both download links until someone fetched one.
      - name: The latest-download link serves the released bytes
        run: |
          sleep 15
          got=$(curl -sL "https://github.com/${{ github.repository }}/releases/latest/download/mypassphrase.html" | sha256sum | cut -d' ' -f1)
          [ "$got" = "$SHA256" ] || { echo "::error::releases/latest/download/mypassphrase.html hashes to $got, expected $SHA256"; exit 1; }
